defaults:
  - model: nano_min_gru_tiny
  - data_openthoughts
  - trainer_lm
  - parallel
  - _self_

# Task: causal language modeling on an OpenThoughts-114k subset.
task: openthoughts_lm

# Models in the run: nano_rnn (mixer selected via model.mixer_type).
models:
  - nano_rnn

# Training modes to run: parallel | bptt (one or both).
modes:
  - parallel
  - bptt

# Optional: override specific keys here
fast_dev_run: false

# Chunk 256 < block 1024 so the scaffold/translator path genuinely engages
# (chunk_size >= seq_len falls back to single-chunk sequential and warns).
# Scaffold hidden dim must be divisible by model.num_heads (8 for Tiny).
parallel:
  chunk_size: 256
  scaffold_dim: 384

callbacks:
  model_checkpoint: true
  early_stopping: true