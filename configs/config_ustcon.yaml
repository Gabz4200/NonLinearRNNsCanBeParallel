defaults:
  - model_ustcon
  - data_ustcon
  - trainer
  - parallel
  - _self_

task: ustcon

# Models in the comparison: mlp_rnn | rkan_rnn | m2rnn | min_gru | min_lstm
models:
  - mlp_rnn
  - rkan_rnn
  - m2rnn

# Training modes to run: parallel | bptt (one or both)
modes:
  - parallel
  - bptt

# Chunk 64 < max_seq_len 256 so the scaffold/translator path genuinely
# engages (chunk_size >= seq_len falls back to single-chunk sequential).
# Scaffold dim must be divisible by model.num_heads (4 here).
parallel:
  chunk_size: 64
  scaffold_dim: 128

# Optional: override specific keys here
fast_dev_run: false
callbacks:
  model_checkpoint: true
  early_stopping: true