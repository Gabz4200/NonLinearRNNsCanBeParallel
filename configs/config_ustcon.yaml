defaults:
  - model_ustcon
  - data_ustcon
  - trainer
  - runtime
  - parallel
  - _self_

task: ustcon
mode: parallel

# Models in the comparison: mlp_rnn | rkan_rnn | m2rnn | min_gru | min_lstm
models:
  - mlp_rnn
  - rkan_rnn
  - m2rnn

# Training modes to run: parallel | bptt (one or both)
modes:
  - parallel
  - bptt

# Optional: override specific keys here
fast_dev_run: false
callbacks:
  model_checkpoint: true
  early_stopping: true