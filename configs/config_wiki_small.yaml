defaults:
  - model: nano_rkan_tiny
  - data_wikipedia_small
  - trainer_lm
  - parallel
  - _self_

# Small Wikipedia LM for a GPU box: en + pt articles, parallel vs BPTT.
task: wikipedia_lm

models:
  - nano_rnn

modes:
  - parallel
  - bptt

fast_dev_run: false

# Chunk 256 < block 1024 so the scaffold/translator path genuinely engages.
# Scaffold dim must be divisible by model.num_heads (8 for nano_rkan_tiny).
parallel:
  chunk_size: 256
  scaffold_dim: 384

callbacks:
  model_checkpoint: true
  early_stopping: true
