defaults:
  - model
  - data
  - trainer
  - parallel
  - _self_

# Task type: sorted_graph_connectivity | ustcon | long_sequence
task: sorted_graph_connectivity

# Models in the run: mlp_rnn | rkan_rnn | m2rnn | min_gru | min_lstm
models:
  - mlp_rnn

# Training modes to run: parallel | bptt (one or both)
modes:
  - parallel

# Chunk 22 divides max_seq_len 66 (3 chunks) and is < 66//2 (33), so the
# scaffold/translator path genuinely engages without padding waste.
parallel:
  chunk_size: 22
  scaffold_dim: 64

# Optional: override specific keys here
fast_dev_run: false
callbacks:
  model_checkpoint: true
  early_stopping: true