model:
  name: "mlp_rnn"
  hidden_dim: 256
  num_layers: 2
  num_heads: 4
  dropout: 0.1
  mlp_hidden_mult: 4
  mlp_num_layers: 2
  rkan_degree: 3
  rkan_alpha: 1.0
  rkan_beta: 1.0
  rkan_iota: 1.0
  rkan_mapping: "algebraic_infinite"
  rkan_type: "jacobi"
  rkan_num_basis: 4
  num_classes: 2
  vocab_size: 64
  max_seq_len: 256
  lr: 1e-3
  weight_decay: 0.01
  warmup_ratio: 0.1
  min_lr_ratio: 0.01
  target_grad_clip: 1.0
  scaffold_grad_clip: 0.5
  translator_grad_clip: 0.5