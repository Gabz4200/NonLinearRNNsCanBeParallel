name: "nano_rnn"
mixer_type: "hope"
vocab_size: 50257
# hidden = head_dim * num_heads = 64; mem_dim == head_dim so the
# HOPE constraint hidden == num_heads * mem_dim holds (each memory is
# [H, N, N] with N = mem_dim = 16, so the parallel translator emits
# num_heads * 5 * mem_dim^2 = 4 * 5 * 256 = 5120 units per boundary).
head_dim: 16
num_layers: 2
num_heads: 4
mem_dim: 16
mlp_hidden_mult: 4
ff_type: "mlp"
dropout: 0.0
tie_embeddings: true
use_pos_emb: false
max_seq_len: 256
key_dim: 64
value_dim: 16
rkan_degree: 3
rkan_alpha: 1.0
rkan_beta: 1.0
rkan_iota: 1.0
rkan_mapping: "algebraic_infinite"
rkan_type: "jacobi"
rkan_num_basis: 4
num_classes: 50257
lr: 3.0e-4
weight_decay: 0.1
warmup_ratio: 0.1
min_lr_ratio: 0.1
target_grad_clip: 1.0
scaffold_grad_clip: 0.5
translator_grad_clip: 0.5
bptt_max_seq_len: 256
