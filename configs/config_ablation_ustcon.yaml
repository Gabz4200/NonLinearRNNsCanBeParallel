defaults:
  - model_ustcon
  - data_ustcon
  - trainer
  - parallel
  - _self_

# Scaffold ablation on ustcon: every scaffold (old: min_gru, min_lstm;
# new: linear_sum, fourier) on one fixed target model, parallel only.
# 4 runs x ~30-60 s on CPU.
task: ustcon

models:
  - mlp_rnn

modes:
  - parallel

fast_dev_run: false

# 256 samples keeps training under a minute per scaffold run.
data:
  num_samples: 256
  batch_size: 32
  num_workers: 0

# Chunk 64 < seq 256 so the scaffold/translator path genuinely engages
# (4 chunks). Scaffold dim divisible by model.num_heads (4).
parallel:
  chunk_size: 64
  scaffold_dim: 128
  scaffold_types: [min_gru, min_lstm, linear_sum, fourier]
  scaffold_positional: true
  translator_pre_norm: true
  translator_norm_type: rmsnorm

trainer:
  max_epochs: 2
  precision: "32-true"
  log_every_n_steps: 5
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1

callbacks:
  model_checkpoint: false
  early_stopping: false