defaults:
  - model: nano_hope_smoke
  - parallel
  - _self_

# HOPE smoke: fast_dev_run-compatible sanity check that the HOPE
# mixer composes through the scaffold/translator wrapper (parallel
# mode only; BPTT parity is what config_hope_tiny measures).
#
# task is mixed_lm so the datamodule reads its keys with cfg.get()
# and tolerates arbitrary CLI overrides; the OpenThoughts module
# builds a strict dataclass and would reject unknown keys.
task: mixed_lm

# NOTE: `models:` holds REGISTRY names resolved by get_model() in
# scripts/train.py -- not Hydra preset names.  The architecture is
# picked by the `model:` default above (nano_hope_smoke sets
# mixer_type: hope); writing a preset name here fails with
# "Model '...' not registered".
models:
  - nano_rnn

modes:
  - parallel

fast_dev_run: false

# Minimal data: a handful of samples per source, 32-token blocks,
# batch 2 -> a single fast_dev_run batch.
data:
  block_size: 32
  max_seq_len: 32
  batch_size: 2
  num_workers: 0
  val_split: 0.2
  test_split: 0.2
  sources:
    - name: wikipedia
      dataset_name: "wikimedia/wikipedia"
      subsets: ["20231101.en"]
      dataset_split: "train"
      articles_per_subset: 4
      subset_seed: 42
      max_article_tokens: 512
    - name: tinystories_instruct
      dataset_name: "roneneldan/TinyStoriesInstruct"
      dataset_split: "train"
      subset_num_samples: 4
      subset_seed: 42

# Chunk 8 < block 32 so the scaffold/translator path genuinely
# engages.  Scaffold dim must be divisible by model.num_heads (4).
parallel:
  chunk_size: 8
  scaffold_dim: 64

trainer:
  accelerator: "cpu"
  devices: 1
  max_epochs: 1
  precision: "32-true"
  log_every_n_steps: 1
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1

callbacks:
  model_checkpoint: false
  early_stopping: false
