[project]
name = "nonlinearrnnscanbeparallel"
version = "0.1.0"
description = "MLP-RNN and rKAN-RNN implementations with sorted graph connectivity benchmark"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [
    { name = "Researcher", email = "researcher@example.com" },
]
keywords = ["pytorch", "deep-learning", "research", "rnn", "kan"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.26.0",
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.0",
    "safetensors>=0.4.0",
    "lightning>=2.3.0",
    "matplotlib>=3.11.2",
    "transformers>=4.45.0",
    "datasets>=3.0.0",
    "tokenizers>=0.19.0",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.6.0,<2.7.0",
]
cu124 = [
    "torch>=2.6.0,<2.7.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
]
notebooks = [
    "jupyter>=1.0.0",
    "jupytext>=1.15.1,<1.16.0",
    "ipykernel>=6.29.0",
    "nbconvert>=7.16.0",
]

[tool.uv]
conflicts = [
    [{ extra = "cpu" }, { extra = "cu124" }],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu124", extra = "cu124" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nonlinearrnnscanbeparallel"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = "-v"
